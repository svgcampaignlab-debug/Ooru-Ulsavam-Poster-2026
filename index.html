<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ഉജ്ജ്വലം Poster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Anek+Malayalam:wght@700&display=swap');
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:#1a2a50;
    font-family:'Poppins',sans-serif;
    background:
      radial-gradient(circle at 8% 0%, rgba(30,80,180,.12), transparent 36%),
      radial-gradient(circle at 100% 8%, rgba(220,160,40,.1), transparent 40%),
      #f4f7fc;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 12px 48px;
  }
  .bar{width:100%; max-width:460px; height:6px; border-radius:4px; margin-bottom:12px;
    background:linear-gradient(90deg,#1565c0,#f1c40f 50%,#1a237e);}
  h1{font-size:18px; font-weight:800; margin:0 0 4px; text-align:center; color:#1565c0; font-family:'Anek Malayalam',sans-serif;}
  p.sub{margin:0 0 12px; text-align:center; color:#5a6a88; font-size:13px;}
  .stage{width:100%; max-width:380px; border-radius:16px; overflow:hidden;
    box-shadow:0 16px 36px rgba(20,40,80,.18); background:#fff;}
  .stage canvas{display:block; width:100%; height:auto;}
  .cards{width:100%; max-width:480px; margin-top:14px; display:flex; flex-direction:column; gap:12px;}
  .card{background:#fff; border-radius:16px; padding:14px 16px; border:1px solid #dce6f2;
    box-shadow:0 8px 18px rgba(20,40,80,.05); position:relative; overflow:hidden;}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,#1565c0,#f1c40f);}
  .card-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .num{width:24px; height:24px; border-radius:50%; color:#fff; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; background:#1565c0;}
  .ttl{font-size:14.5px; font-weight:800; color:#1565c0;}
  label{display:block; font-size:12px; color:#5a6a88; font-weight:700; margin-bottom:6px;}
  input[type="text"], select{
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid #dce6f2; background:#f8fbff;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; outline:none; color:#1a2a50;
    text-transform:uppercase;
  }
  input:focus, select:focus{border-color:#1565c0;}
  .btn{width:100%; padding:12px; border:none; border-radius:10px; font-weight:800; cursor:pointer; font-family:'Poppins',sans-serif;}
  .btn-photo{background:linear-gradient(135deg,#1565c0,#0d47a1); color:#fff;}
  .btn-recrop{background:#eef4fb; color:#1565c0; border:1.5px solid #c9d8ee; margin-top:8px;}
  .btn-reset{background:#fff; color:#8a3a3a; border:1.5px solid #f0c7c7; margin-top:8px;}
  .btn-recrop:disabled,.btn-reset:disabled{opacity:.4; cursor:not-allowed;}
  .photo-row{display:flex; gap:10px; align-items:center;}
  .thumb{width:72px; height:72px; border-radius:50%; border:2px dashed #c9d8ee; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:#f6f9fd; flex-shrink:0;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .hint{font-size:11.5px; color:#6a7a98; margin-top:8px; line-height:1.45;}
  .btn-download{background:linear-gradient(135deg,#0d47a1,#1565c0); color:#fff; font-size:15.5px; padding:15px;}
  #filePhoto{display:none;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(10,20,40,.86); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal-card{background:#fff; border-radius:18px; padding:20px; width:100%; max-width:440px; text-align:center;}
  .modal-card h2{margin:0 0 6px; color:#1565c0; font-size:16px;}
  .crop-wrap{margin:0 auto 12px; border-radius:50%; overflow:hidden; background:#eef4fb; touch-action:none; cursor:grab;}
  .crop-wrap canvas{display:block; width:100%; height:auto;}
  .zoom-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .zoom-row input{flex:1; accent-color:#1565c0;}
  .modal-actions{display:flex; gap:10px;}
  .btn-cancel{background:#eef2f6; color:#4a5568;}
</style>
</head>
<body>
  <div class="bar"></div>
  <h1>ഉജ്ജ്വലം</h1>
  <p class="sub">ഫോട്ടോ, പേര്, ജില്ല ചേർത്ത് പോസ്റ്റർ തയ്യാറാക്കൂ</p>
  <div class="stage"><canvas id="posterCanvas" width="2400" height="3200"></canvas></div>
  <div class="cards">
    <div class="card">
      <div class="card-head"><span class="num">1</span><span class="ttl">PHOTO</span></div>
      <div class="photo-row">
        <div class="thumb" id="photoThumb">📷</div>
        <div style="flex:1">
          <button class="btn btn-photo" id="pickPhotoBtn">UPLOAD PHOTO</button>
          <button class="btn btn-recrop" id="recropPhotoBtn" disabled>✂️ CROP</button>
          <button class="btn btn-reset" id="resetPhotoBtn" disabled>↺ RESET</button>
        </div>
      </div>
      <p class="hint">Round frame will be fully covered.</p>
    </div>
    <div class="card">
      <div class="card-head"><span class="num">2</span><span class="ttl">NAME</span></div>
      <label for="nameInput">English CAPITAL</label>
      <input type="text" id="nameInput" maxlength="28" placeholder="NAME" autocomplete="off">
    </div>
    <div class="card">
      <div class="card-head"><span class="num">3</span><span class="ttl">DISTRICT</span></div>
      <label for="distInput">Select</label>
      <select id="distInput">
        <option value="">— SELECT DISTRICT —</option>
        <option>THIRUVANANTHAPURAM</option>
        <option>KOLLAM</option>
        <option>PATHANAMTHITTA</option>
        <option>ALAPPUZHA</option>
        <option>KOTTAYAM</option>
        <option>IDUKKI</option>
        <option>ERNAKULAM</option>
        <option>THRISSUR</option>
        <option>PALAKKAD</option>
        <option>MALAPPURAM</option>
        <option>KOZHIKODE</option>
        <option>WAYANAD</option>
        <option>KANNUR</option>
        <option>KASARAGOD</option>
      </select>
    </div>
    <button class="btn btn-download" id="downloadBtn">⬇ DOWNLOAD POSTER</button>
    <input type="file" id="filePhoto" accept="image/*">
  </div>
  <div class="modal-backdrop" id="cropModal">
    <div class="modal-card">
      <h2>CROP PHOTO</h2>
      <p style="color:#5a6a88;font-size:12px;margin:0 0 12px">Drag to move, zoom to fit. Circle will be filled.</p>
      <div class="crop-wrap" id="cropWrap"><canvas id="cropCanvas"></canvas></div>
      <div class="zoom-row"><span>➖</span><input type="range" id="zoomRange" min="100" max="350" value="100"><span>➕</span></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="cropCancelBtn">CANCEL</button>
        <button class="btn btn-photo" id="cropConfirmBtn">✔ OK</button>
      </div>
    </div>
  </div>

    const sc=baseScale*zoom, w=pendingImg.width*sc, h=pendingImg.height*sc;
    const mx=Math.max(0,(w-PW)/2), my=Math.max(0,(h-PH)/2);
    panX=Math.min(mx,Math.max(-mx,panX)); panY=Math.min(my,Math.max(-my,panY));
  }
  function drawCrop(){
    cropCtx.clearRect(0,0,PW,PH);
    cropCtx.save();
    cropCtx.beginPath();
    cropCtx.arc(PW/2, PH/2, PW/2, 0, Math.PI*2);
    cropCtx.clip();
    cropCtx.fillStyle='#eef4fb'; cropCtx.fillRect(0,0,PW,PH);
    if(pendingImg){ const d=cur(); cropCtx.drawImage(pendingImg,d.x,d.y,d.w,d.h); }
    cropCtx.restore();
  }
  function openCrop(img){
    pendingImg=img;
    cropCanvas.width=PW; cropCanvas.height=PH;
    baseScale=Math.max(PW/img.width, PH/img.height);
    zoom=1; panX=0; panY=0; zoomRange.value=100;
    drawCrop(); cropModal.classList.add('open');
  }
  cropWrap.addEventListener('pointerdown', e=>{
    if(!pendingImg) return;
    dragging=true; cropWrap.setPointerCapture(e.pointerId);
    dsx=e.clientX; dsy=e.clientY; psx=panX; psy=panY;
  });
  cropWrap.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const rect=cropCanvas.getBoundingClientRect();
    panX=psx+(e.clientX-dsx)*(PW/rect.width);
    panY=psy+(e.clientY-dsy)*(PH/rect.height);
    clamp(); drawCrop();
  });
  cropWrap.addEventListener('pointerup', ()=>dragging=false);
  cropWrap.addEventListener('pointercancel', ()=>dragging=false);
  zoomRange.addEventListener('input', ()=>{ zoom=parseInt(zoomRange.value,10)/100; clamp(); drawCrop(); });
  document.getElementById('cropCancelBtn').onclick=()=>cropModal.classList.remove('open');
  document.getElementById('cropConfirmBtn').onclick=()=>{
    const d=cur();
    const dia=CIRCLE.r*2;
    photoPlacement={ img:pendingImg, x:(d.x-PW/2)*(dia/PW), y:(d.y-PH/2)*(dia/PH), w:d.w*(dia/PW), h:d.h*(dia/PH) };
    document.getElementById('recropPhotoBtn').disabled=false;
    document.getElementById('resetPhotoBtn').disabled=false;
    const thumb=document.getElementById('photoThumb'); thumb.innerHTML='';
    const im=document.createElement('img'); im.src=pendingImg.src; thumb.appendChild(im);
    cropModal.classList.remove('open'); draw();
  };
  const filePhoto=document.getElementById('filePhoto');
  document.getElementById('pickPhotoBtn').onclick=()=>filePhoto.click();
  filePhoto.addEventListener('change', e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=ev=>{ const img=new Image(); img.onload=()=>openCrop(img); img.src=ev.target.result; };
    r.readAsDataURL(file); filePhoto.value='';
  });
  document.getElementById('recropPhotoBtn').onclick=()=>{ if(photoPlacement) openCrop(photoPlacement.img); };
  document.getElementById('resetPhotoBtn').onclick=()=>{
    photoPlacement=null; document.getElementById('photoThumb').innerHTML='📷';
    document.getElementById('recropPhotoBtn').disabled=true;
    document.getElementById('resetPhotoBtn').disabled=true; draw();
  };
  document.getElementById('downloadBtn').onclick=()=>{
    draw();
    const nm=(val('nameInput')||'poster').replace(/\s+/g,'_');
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='ujjwalam-'+nm+'.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    },'image/jpeg',0.92);
  };
})();
</script>
</body>
